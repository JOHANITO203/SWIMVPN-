plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def xrayCoreVersion = providers.gradleProperty("xrayCoreVersion").getOrElse("v26.3.27")
def xrayAssetRoot = "runtime/xray"
def tun2SocksAssetRoot = "runtime/tun2socks"
def xrayArtifactByAbi = [
    "arm64-v8a"  : "Xray-android-arm64-v8a.zip",
    "x86_64"     : "Xray-android-amd64.zip",
]
def tun2SocksExecutableName = "tun2socks"
def tun2SocksSharedLibraryName = "libhev-socks5-tunnel.so"
def tun2SocksUpstreamTag = providers.gradleProperty("tun2socksUpstreamTag").getOrElse("2.14.4")
def tun2SocksBinaryByAbi = [
    "arm64-v8a": providers.gradleProperty("tun2socksArm64Path").orNull,
    "x86_64"   : providers.gradleProperty("tun2socksX8664Path").orNull,
]
def tun2SocksSharedLibraryByAbi = [
    "arm64-v8a": providers.gradleProperty("tun2socksArm64SoPath").orNull,
    "x86_64"   : providers.gradleProperty("tun2socksX8664SoPath").orNull,
]
def generatedRuntimeAssetsDir = layout.buildDirectory.dir("generated/runtimeAssets/main").get().asFile
def generatedRuntimeJniLibsDir = layout.buildDirectory.dir("generated/runtimeJniLibs/main").get().asFile
def xrayDownloadsDir = layout.buildDirectory.dir("downloads/xray/${xrayCoreVersion}").get().asFile
def xrayExtractDir = layout.buildDirectory.dir("intermediates/xrayExtract").get().asFile
def tun2SocksSourceRoot = layout.buildDirectory.dir("downloads/tun2socks/${tun2SocksUpstreamTag}").get().asFile

def ensureTun2SocksSourceCheckout = {
    def repoDir = file("${tun2SocksSourceRoot}/jni")
    def checkoutLooksValid = repoDir.exists() &&
        file("${repoDir}/.git").exists() &&
        file("${repoDir}/Android.mk").exists()

    if (repoDir.exists() && !checkoutLooksValid) {
        logger.lifecycle("Removing incomplete tun2socks source checkout at ${repoDir}")
        delete(repoDir)
    }

    if (!checkoutLooksValid) {
        repoDir.parentFile.mkdirs()
        exec {
            workingDir(tun2SocksSourceRoot)
            commandLine("git", "clone", "--recursive", "--depth", "1", "--branch", tun2SocksUpstreamTag, "https://github.com/heiher/hev-socks5-tunnel", "jni")
        }
    }
    return repoDir
}

def repairTun2SocksWindowsSymlinks = { File repoDir ->
    fileTree(repoDir).matching { include "**/*" }.files.each { candidate ->
        if (!candidate.isFile() || candidate.length() >= 260L) {
            return
        }

        def raw = candidate.getText("UTF-8").trim()
        if (!(raw ==~ /^\.{1,2}\/.+/) || raw.contains("\n") || raw.contains("\r")) {
            return
        }

        def target = new File(candidate.parentFile, raw).canonicalFile
        if (target.exists() && target.isFile()) {
            candidate.bytes = target.bytes
        }
    }
}

def buildTun2SocksSharedLibraries = { File repoDir, List<String> abis ->
    def ndkDir = file("${android.sdkDirectory}/ndk/${android.ndkVersion}")
    if (!ndkDir.exists()) {
        throw new IllegalStateException("Android NDK ${android.ndkVersion} is not installed under ${android.sdkDirectory}/ndk")
    }

    def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    def ndkBuildExecutable = isWindows ? "ndk-build.cmd" : "ndk-build"
    def ndkBuildPath = new File(ndkDir, ndkBuildExecutable).absolutePath
    
    if (!file(ndkBuildPath).exists()) {
        throw new IllegalStateException("ndk-build executable not found at ${ndkBuildPath}")
    }

    logger.lifecycle("Building tun2socks shared libraries for ABIs: ${abis} using NDK at ${ndkDir}")

    exec {
        // Run ndk-build from the parent of the jni folder, which is the standard project root for ndk-build
        workingDir(repoDir.parentFile)
        commandLine(
            ndkBuildPath,
            "-j${Runtime.getRuntime().availableProcessors()}",
            "NDK_PROJECT_PATH=.",
            "APP_BUILD_SCRIPT=jni/Android.mk",
            "NDK_APPLICATION_MK=jni/Application.mk",
            "APP_ABI=${abis.join(' ')}",
            "APP_LDFLAGS=-Wl,-z,max-page-size=16384"
        )
    }
}

def locateTun2SocksSharedLibrary = { String abi ->
    def candidatePaths = [
        file("${tun2SocksSourceRoot}/libs/${abi}/${tun2SocksSharedLibraryName}"),
        file("${tun2SocksSourceRoot}/jni/libs/${abi}/${tun2SocksSharedLibraryName}"),
        file("${tun2SocksSourceRoot}/obj/local/${abi}/${tun2SocksSharedLibraryName}"),
        file("${tun2SocksSourceRoot}/jni/obj/local/${abi}/${tun2SocksSharedLibraryName}"),
    ]

    return candidatePaths.find { it.exists() }
}

// --- Release signing -------------------------------------------------------
// Credentials are read from a file OUTSIDE the repo so no secret is ever committed:
//   <user.home>/.swimvpn-signing/keystore.properties  (storeFile/storePassword/keyAlias/keyPassword)
// If the file is absent or incomplete, the release build falls back to UNSIGNED.
def swimvpnKeystorePropsFile = file("${System.getProperty('user.home')}/.swimvpn-signing/keystore.properties")
def swimvpnKeystoreProps = new Properties()
def swimvpnHasReleaseSigning = false
if (swimvpnKeystorePropsFile.exists()) {
    swimvpnKeystorePropsFile.withInputStream { swimvpnKeystoreProps.load(it) }
    def sp = swimvpnKeystoreProps.getProperty('storePassword', '').trim()
    def sf = swimvpnKeystoreProps.getProperty('storeFile', '').trim()
    def ka = swimvpnKeystoreProps.getProperty('keyAlias', '').trim()
    swimvpnHasReleaseSigning = !sp.isEmpty() && !sf.isEmpty() && !ka.isEmpty() && file(sf).exists()
    if (!swimvpnHasReleaseSigning) {
        logger.warn("SWIMVPN release signing: ${swimvpnKeystorePropsFile} is present but incomplete -> release will be UNSIGNED")
    }
} else {
    logger.warn("SWIMVPN release signing: ${swimvpnKeystorePropsFile} not found -> release will be UNSIGNED")
}

android {
    namespace 'com.swimvpn.app'
    compileSdk 34
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.swimvpn.app"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "1.0.13"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
            }
        }

        buildConfigField "String", "XRAY_CORE_VERSION", "\"${xrayCoreVersion}\""
        buildConfigField "String", "XRAY_ASSET_ROOT", "\"${xrayAssetRoot}\""
        buildConfigField "String", "XRAY_EXECUTABLE_LIBRARY_NAME", "\"libxray.so\""
        buildConfigField "String", "TUN2SOCKS_ASSET_ROOT", "\"${tun2SocksAssetRoot}\""
        buildConfigField "String", "TUN2SOCKS_EXECUTABLE_NAME", "\"${tun2SocksExecutableName}\""
        buildConfigField "String", "TUN2SOCKS_SHARED_LIBRARY_NAME", "\"${tun2SocksSharedLibraryName}\""
    }

    signingConfigs {
        release {
            if (swimvpnHasReleaseSigning) {
                storeFile file(swimvpnKeystoreProps.getProperty('storeFile').trim())
                storePassword swimvpnKeystoreProps.getProperty('storePassword').trim()
                keyAlias swimvpnKeystoreProps.getProperty('keyAlias').trim()
                def kp = swimvpnKeystoreProps.getProperty('keyPassword', '').trim()
                keyPassword (kp.isEmpty() ? swimvpnKeystoreProps.getProperty('storePassword').trim() : kp)
            }
        }
    }
    buildTypes {
        debug {
            // Distinct applicationId so the Onion Stealth debug spike can be installed ALONGSIDE the
            // signed prod build (different package + different signature → no uninstall, no data loss).
            // The updater FileProvider authority is ${applicationId}.updateprovider, so it becomes
            // com.swimvpn.app.debug.updateprovider → no INSTALL_FAILED_CONFLICTING_PROVIDER.
            applicationIdSuffix ".debug"
            versionNameSuffix "-onion-debug"
        }
        release {
            if (swimvpnHasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // Distribution split (design docs/superpowers/specs/2026-06-14-auto-update-design.md §2) :
    // `sideload` = build public actuel (APK landing/GitHub) AVEC l'auto-update in-app ;
    // `play` = futur build Play Store SANS la feature (Google interdit REQUEST_INSTALL_PACKAGES
    // et le code d'auto-install ; le code installeur vit dans src/sideload/, stub dans src/play/).
    // NB build : les tâches deviennent assembleSideloadRelease / apk/sideload/release/.
    flavorDimensions "distribution"
    productFlavors {
        sideload {
            dimension "distribution"
            buildConfigField "boolean", "AUTO_UPDATE_ENABLED", "true"
            buildConfigField "String", "UPDATE_MANIFEST_URL", "\"https://app.swimvpn.pro/version.json\""
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "AUTO_UPDATE_ENABLED", "false"
            buildConfigField "String", "UPDATE_MANIFEST_URL", "\"\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    sourceSets {
        main {
            assets.srcDir(generatedRuntimeAssetsDir)
            jniLibs.srcDir(generatedRuntimeJniLibsDir)
        }
    }
    externalNativeBuild {
        cmake {
            path file("CMakeLists.txt")
            version "3.22.1"
        }
    }
}

tasks.register("prepareXrayRuntimeAssets") {
    inputs.property("xrayCoreVersion", xrayCoreVersion)
    inputs.property("xrayArtifactByAbi", xrayArtifactByAbi.toString())
    inputs.property("abis", android.defaultConfig.ndk.abiFilters.toString())
    outputs.dir(generatedRuntimeAssetsDir)
    outputs.dir(generatedRuntimeJniLibsDir)

    doLast {
        generatedRuntimeAssetsDir.mkdirs()
        generatedRuntimeJniLibsDir.mkdirs()
        xrayDownloadsDir.mkdirs()
        xrayExtractDir.mkdirs()

        def commonTargetDir = file("${generatedRuntimeAssetsDir}/${xrayAssetRoot}/common")
        delete(commonTargetDir)
        commonTargetDir.mkdirs()
        def copiedCommonFiles = false

        xrayArtifactByAbi.each { abi, archiveName ->
            def archiveFile = file("${xrayDownloadsDir}/${archiveName}")
            def downloadUrl = "https://github.com/XTLS/Xray-core/releases/download/${xrayCoreVersion}/${archiveName}"

            if (!archiveFile.exists()) {
                logger.lifecycle("Downloading official Xray core ${xrayCoreVersion} for ${abi}")
                new URL(downloadUrl).withInputStream { stream ->
                    archiveFile.withOutputStream { output ->
                        output << stream
                    }
                }
            }

            def abiExtractDir = file("${xrayExtractDir}/${abi}")
            delete(abiExtractDir)
            copy {
                from zipTree(archiveFile)
                into abiExtractDir
            }

            def extractedBinary = fileTree(abiExtractDir).matching {
                include "**/xray"
            }.files.find { it.isFile() }

            if (extractedBinary == null) {
                throw new IllegalStateException("Official Xray archive ${archiveName} did not contain an xray executable")
            }

            def targetDir = file("${generatedRuntimeJniLibsDir}/${abi}")
            targetDir.mkdirs()
            delete(file("${targetDir}/libxray.so"))

            copy {
                from extractedBinary
                into targetDir
                rename { "libxray.so" }
            }

            if (!copiedCommonFiles) {
                copy {
                    from fileTree(abiExtractDir).matching {
                        include "**/geoip.dat"
                        include "**/geosite.dat"
                    }
                    into commonTargetDir
                }
                copiedCommonFiles = true
            }
        }
    }
}

tasks.register("prepareTun2SocksRuntimeAssets") {
    inputs.property("tun2SocksUpstreamTag", tun2SocksUpstreamTag)
    inputs.property("tun2SocksBinaryByAbi", tun2SocksBinaryByAbi.collectEntries { k, v -> [k, v?.toString()] })
    inputs.property("tun2SocksSharedLibraryByAbi", tun2SocksSharedLibraryByAbi.collectEntries { k, v -> [k, v?.toString()] })
    inputs.property("ndkVersion", android.ndkVersion)
    inputs.property("abis", android.defaultConfig.ndk.abiFilters.toString())
    outputs.dir(generatedRuntimeAssetsDir)
    outputs.dir(generatedRuntimeJniLibsDir)

    doLast {
        def tun2SocksRoot = file("${generatedRuntimeAssetsDir}/${tun2SocksAssetRoot}")
        delete(tun2SocksRoot)
        tun2SocksRoot.mkdirs()

        def availability = []

        def missingSharedLibraryAbis = []

        tun2SocksBinaryByAbi.each { abi, binaryPath ->
            def abiDir = file("${tun2SocksRoot}/${abi}")
            abiDir.mkdirs()

            def sourceFile = binaryPath ? file(binaryPath) : null
            def executableAvailable = sourceFile != null && sourceFile.exists()

            def sharedLibraryPath = tun2SocksSharedLibraryByAbi[abi]
            def sharedLibrarySourceFile = sharedLibraryPath ? file(sharedLibraryPath) : null
            def sharedLibraryAvailable = sharedLibrarySourceFile != null && sharedLibrarySourceFile.exists()
            def jniTargetDir = file("${generatedRuntimeJniLibsDir}/${abi}")
            jniTargetDir.mkdirs()
            def jniTargetFile = file("${jniTargetDir}/${tun2SocksSharedLibraryName}")

            if (jniTargetFile.exists()) {
                delete(jniTargetFile)
            }

            if (executableAvailable) {
                copy {
                    from sourceFile
                    into abiDir
                    rename { tun2SocksExecutableName }
                }
            }

            if (sharedLibraryAvailable) {
                copy {
                    from sharedLibrarySourceFile
                    into jniTargetDir
                    rename { tun2SocksSharedLibraryName }
                }
            } else {
                missingSharedLibraryAbis << abi
            }

            if (sharedLibraryAvailable && !jniTargetFile.exists()) {
                missingSharedLibraryAbis << abi
            }
        }

        if (!missingSharedLibraryAbis.isEmpty()) {
            def repoDir = ensureTun2SocksSourceCheckout()
            repairTun2SocksWindowsSymlinks(repoDir)
            buildTun2SocksSharedLibraries(repoDir, missingSharedLibraryAbis.unique())

            missingSharedLibraryAbis.unique().each { abi ->
                def builtFile = locateTun2SocksSharedLibrary(abi)
                if (builtFile == null || !builtFile.exists()) {
                    throw new IllegalStateException("tun2socks source build did not produce ${tun2SocksSharedLibraryName} for ${abi}")
                }
                def jniTargetDir = file("${generatedRuntimeJniLibsDir}/${abi}")
                jniTargetDir.mkdirs()
                copy {
                    from builtFile
                    into jniTargetDir
                    rename { tun2SocksSharedLibraryName }
                }
            }
        }

        availability = []

        tun2SocksBinaryByAbi.each { abi, binaryPath ->
            def abiDir = file("${tun2SocksRoot}/${abi}")
            abiDir.mkdirs()

            def sourceFile = binaryPath ? file(binaryPath) : null
            def executableAvailable = sourceFile != null && sourceFile.exists()
            def jniTargetDir = file("${generatedRuntimeJniLibsDir}/${abi}")
            def jniTargetFile = file("${jniTargetDir}/${tun2SocksSharedLibraryName}")
            def sharedLibraryAvailable = jniTargetFile.exists()

            def preferredLaunchMode = sharedLibraryAvailable ? "jni" : (executableAvailable ? "executable" : "missing")
            def reason = sharedLibraryAvailable
                ? "shared library packaged from local property or upstream source build"
                : (executableAvailable
                    ? "local executable provided via Gradle property"
                    : "no local tun2socks shared library or executable configured for this ABI")

            availability << [
                abi                            : abi,
                available                      : sharedLibraryAvailable || executableAvailable,
                preferredLaunchMode            : preferredLaunchMode,
                executableAvailable            : executableAvailable,
                executableSourcePath           : binaryPath ?: "",
                executableAssetPath            : executableAvailable ? "${tun2SocksAssetRoot}/${abi}/${tun2SocksExecutableName}" : "",
                packagedSharedLibraryAvailable : sharedLibraryAvailable,
                packagedSharedLibrarySourcePath: sharedLibraryAvailable ? jniTargetFile.absolutePath : "",
                packagedSharedLibraryName      : sharedLibraryAvailable ? tun2SocksSharedLibraryName : "",
                reason                         : reason,
            ]
        }

        def availabilityFile = file("${tun2SocksRoot}/availability.json")
        availabilityFile.text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson([
                generatedAt: new Date().format("yyyy-MM-dd'T'HH:mm:ssXXX"),
                entries    : availability,
            ])
        )
    }
}

tasks.named("preBuild").configure {
    dependsOn(tasks.named("prepareXrayRuntimeAssets"))
    dependsOn(tasks.named("prepareTun2SocksRuntimeAssets"))
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Navigation & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    // Retrofit (Network)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // DataStore (Local Storage)
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // Google Code Scanner keeps scanning in Play Services instead of bundling image-processing natives.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // Onion Stealth: embedded Tor client (guardianproject TorService) + control library. The embedded
    // Tor is chained UNDER the REALITY tunnel (Tor-over-REALITY) so the ISP never sees Tor and Tor needs
    // no bridges. Adds ~10-15 MB/ABI of native tor. See DECISIONS.md 2026-07-02.
    // Pinned to the latest 0.4.8.x (minCompileSdk=1). 0.4.9.x requires compileSdk 37 / newer AGP —
    // an out-of-scope toolchain bump. Revisit when the project moves to compileSdk 37+.
    // tor-android is a Java library but declares an open kotlin-stdlib dep that wins conflict
    // resolution and drags the whole app onto kotlin-stdlib 2.3.0 (unreadable by the project's
    // Kotlin 1.9 compiler). It needs no Kotlin at runtime, so exclude it and keep the app's stdlib.
    implementation('info.guardianproject:tor-android:0.4.8.22') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-common'
    }
    implementation 'info.guardianproject:jtorctl:0.4.5.7'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
