server {
    listen 3000;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    # Behind the Dokploy/TLS proxy nginx listens on :3000 over http; without these, the
    # automatic trailing-slash 301 on a directory (e.g. /fr -> /fr/) is built as an absolute
    # URL using the listen port+scheme -> "http://host:3000/fr/" (insecure, wrong port).
    # Relative redirects keep the original https host/port that the browser used.
    absolute_redirect off;
    port_in_redirect off;

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache";
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
        try_files /sitemap.xml =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files /site.webmanifest =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
